global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert-rules.yml"

scrape_configs:
  - job_name: "gatelms-backend"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 15s
    honor_labels: true
    static_configs:
      - targets: ["backend:8080"]
        labels:
          application: "gate-lms-backend"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
