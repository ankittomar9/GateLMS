server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: gatelms-backend-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: gatelms-backend
          app: gate-lms-backend
          __path__: /var/log/gatelms/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger_name
            message: message
            trace_id: traceId
            span_id: spanId
      - labels:
          level:
          trace_id:
