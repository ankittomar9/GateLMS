networks:
  gatelms-net:
    name: gatelms-net
    driver: bridge

services:
  # 1. PostgreSQL 16 Relational Store (Syllabus, Questions, Mocks, Mistake Log, Notes)
  postgres:
    image: postgres:16-alpine
    container_name: gatelms-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-gatelms_db}
    volumes:
      - gatelms_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      - gatelms-net
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gatelms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. GateLMS Core Backend Service (Kotlin + Spring Boot 3.4.2)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gatelms-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-seed}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/gatelms_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://tempo:4318/v1/traces}
      - GATELMS_ADMIN_INITIAL_PASSWORD=${GATELMS_ADMIN_INITIAL_PASSWORD:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-${GOOGLE_API_KEY:-${AI_STUDIO_API_KEY:-}}}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-${GEMINI_API_KEY:-}}
      - AI_STUDIO_API_KEY=${AI_STUDIO_API_KEY:-${GEMINI_API_KEY:-}}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_DEFAULT_MODEL=${GEMINI_DEFAULT_MODEL:-gemini-3.8-flash}
      - WHISPER_ENDPOINT=${WHISPER_ENDPOINT_DOCKER:-http://gatelms-whisper-sidecar:8178/inference}
      - WHISPER_ENABLED=${WHISPER_ENABLED:-true}
      - OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
    volumes:
      - ./logs:/app/logs
      - gatelms_uploads:/app/uploads
      - notes-data:/docker-data/notes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gatelms-net
    mem_limit: 768m
    restart: unless-stopped

  # 3. GateLMS Frontend Cockpit (React 19 + Vite + Tailwind + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gatelms-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    networks:
      - gatelms-net
    mem_limit: 128m
    restart: unless-stopped

  # Whisper.cpp Neural STT Sidecar Service
  whisper-sidecar:
    build:
      context: ./whisper-sidecar
      dockerfile: Dockerfile
    image: gatelms/whisper-sidecar:latest
    container_name: gatelms-whisper-sidecar
    ports:
      - "127.0.0.1:8178:8178"
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8178/"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      gatelms-net:
        aliases:
          - whisper-sidecar
          - gatelms-whisper-sidecar

  # 4. Loki 3.x Log Aggregation Engine
  loki:
    image: grafana/loki:3.0.0
    container_name: gatelms-loki
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - loki_data:/loki
      - ./docker/observability/loki-config.yaml:/etc/loki/config.yaml:ro
    networks:
      - gatelms-net

  # 5. Tempo 2.x Distributed Tracing Store (OTLP HTTP/gRPC receiver)
  tempo:
    image: grafana/tempo:2.4.1
    container_name: gatelms-tempo
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4318:4318"
    volumes:
      - tempo_data:/var/tempo
      - ./docker/observability/tempo.yaml:/etc/tempo.yaml:ro
    networks:
      - gatelms-net

  # 6. Promtail 3.x Scrapes host logs/gatelms-backend.jsonl into Loki
  promtail:
    image: grafana/promtail:3.0.0
    container_name: gatelms-promtail
    profiles: ["observability"]
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./logs:/var/log/gatelms:ro
      - ./docker/observability/promtail.yaml:/etc/promtail/config.yaml:ro
    networks:
      - gatelms-net

  # 7. Grafana Dashboard & Analytics
  grafana:
    image: grafana/grafana:11.0.0
    container_name: gatelms-grafana
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - gatelms-net

  # 8. Prometheus Metrics Scraper & TSDB
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: gatelms-prometheus
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    networks:
      - gatelms-net
    mem_limit: 256m
    restart: unless-stopped

volumes:
  gatelms_postgres_data:
    name: gatelms_postgres_data
  gatelms_uploads:
    name: gatelms_uploads
  notes-data:
    name: gatelms_notes_data
  loki_data:
    name: gatelms_loki_data
  tempo_data:
    name: gatelms_tempo_data
  grafana_data:
    name: gatelms_grafana_data
  prometheus_data:
    name: gatelms_prometheus_data
