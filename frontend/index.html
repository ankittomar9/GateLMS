<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#0F1115" id="meta-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GateLMS — High-ROI GATE CSE 2028 Study Engine</title>
    <script>
      (function () {
        var d = 'tuf';
        try {
          var v = localStorage.getItem('gatelms_design');
          if (v === 'ink' || v === 'aurora' || v === 'sky' || v === 'tuf') d = v;
        } catch (e) { /* private mode / sandbox */ }
        document.documentElement.setAttribute('data-design', d);
        var themeColors = { tuf: '#0F1115', ink: '#0F1115', aurora: '#0F111A', sky: '#0F172A' };
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && themeColors[d]) meta.setAttribute('content', themeColors[d]);
      })();
    </script>
  </head>

  <body class="bg-ds-bg text-ds-primary font-ds-sans antialiased selection:bg-ds-accent-soft selection:text-ds-accent min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
