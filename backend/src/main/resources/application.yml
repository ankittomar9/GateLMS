server:
  port: 8080
  servlet:
    session:
      cookie:
        name: GATELMSSESSION
        http-only: true
        same-site: strict
        secure: false

spring:
  application:
    name: gate-lms-backend

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:gatelms_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

app:
  admin:
    initial-password: ${GATELMS_ADMIN_INITIAL_PASSWORD:}
  cors:
    allowed-origins: http://localhost:5173
  storage:
    notes-dir: uploads/notes
  notes:
    storage-dir: ${APP_NOTES_STORAGE_DIR:./docker-data/notes}
  seed:
    path: seed-data/questions.jsonl
  notifications:
    morning-cron: ${APP_NOTIFICATIONS_MORNING_CRON:0 0 8 * * *}
    evening-cron: ${APP_NOTIFICATIONS_EVENING_CRON:0 0 20 * * *}
  ai:
    providers:
      groq:
        api-key: ${GROQ_API_KEY:}
        default-model: ${GROQ_DEFAULT_MODEL:llama-3.3-70b-versatile}
        stt-model: ${GROQ_STT_MODEL:whisper-large-v3-turbo}
        endpoint: https://api.groq.com/openai/v1
      gemini:
        api-key: ${GEMINI_API_KEY:}
        default-model: ${GEMINI_DEFAULT_MODEL:gemini-3.8-flash}
        endpoint: https://generativelanguage.googleapis.com/v1beta/models
      openai:
        api-key: ${OPENAI_API_KEY:}
        default-model: ${OPENAI_DEFAULT_MODEL:gpt-4o-mini}
        endpoint: https://api.openai.com/v1
      ollama:
        endpoint: ${OLLAMA_ENDPOINT:http://localhost:11434}
        default-model: ${OLLAMA_DEFAULT_MODEL:llama3}
    whisper:
      local-endpoint: ${WHISPER_ENDPOINT:http://localhost:8178/inference}
      stt-provider: ${STT_PROVIDER:auto}
    http:
      connect-timeout-ms: 3000
      chat-read-timeout-ms: 60000
      stt-read-timeout-ms: 90000
      status-read-timeout-ms: 2000
      max-retries: 1
    quota:
      chat-per-hour: 20
      transcribe-per-10min: 10
      status-per-hour: 60

