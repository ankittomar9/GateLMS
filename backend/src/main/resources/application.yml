server:
  port: 8080
  servlet:
    session:
      cookie:
        name: GATELMSSESSION
        http-only: true
        same-site: strict
        secure: false

spring:
  application:
    name: gate-lms-backend

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:gatelms_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

app:
  admin:
    initial-password: ${GATELMS_ADMIN_INITIAL_PASSWORD:admin123}
  cors:
    allowed-origins: http://localhost:5173
  storage:
    notes-dir: uploads/notes
  notes:
    storage-dir: ${APP_NOTES_STORAGE_DIR:./docker-data/notes}
  seed:
    path: seed-data/questions.jsonl
  notifications:
    morning-cron: ${APP_NOTIFICATIONS_MORNING_CRON:0 0 8 * * *}
    evening-cron: ${APP_NOTIFICATIONS_EVENING_CRON:0 0 20 * * *}
