spring:
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: false
app:
  admin:
    initial-password: ${GATELMS_ADMIN_INITIAL_PASSWORD:admin123}
  storage:
    notes-dir: target/test-uploads
  notes:
    storage-dir: ${APP_NOTES_STORAGE_DIR:target/test-notes}
  seed:
    path: seed-data/questions.jsonl
